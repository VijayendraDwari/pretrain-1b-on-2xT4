name: Refresh derived results

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Regenerate plot and checksums
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet matplotlib
          python results/plot_validation.py
          python - <<'PY'
          from pathlib import Path
          import hashlib, json
          root=Path(".")
          wf=root/".github/workflows/refresh-results.yml"
          if wf.exists():
              wf.unlink()
          checks={}
          for p in sorted(root.rglob("*")):
              if not p.is_file() or ".git" in p.parts or p.name=="CHECKSUMS.json":
                  continue
              b=p.read_bytes()
              checks[str(p)]={"bytes":len(b),"sha256":hashlib.sha256(b).hexdigest()}
          (root/"CHECKSUMS.json").write_text(json.dumps(checks,indent=2)+"\n")
          PY
      - name: Commit derived artifacts
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Refresh validation figure and checksums"
          git push
