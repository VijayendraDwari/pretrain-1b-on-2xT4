name: Bootstrap repository content

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Reconstruct and expand prepared repository
        shell: bash
        run: |
          set -euo pipefail

          rm -rf /tmp/pretrain-repo /tmp/repo.b64 /tmp/repo.zip
          mkdir -p /tmp/pretrain-repo

          cat bootstrap/chunks/chunk_*.txt > /tmp/repo.b64
          base64 -d /tmp/repo.b64 > /tmp/repo.zip

          echo "cd305b288d06236dee6c34625b36533e5493422ddcb82c78c4ca761f8e7616f9  /tmp/repo.zip" | sha256sum -c -
          unzip -q /tmp/repo.zip -d /tmp/pretrain-repo
          cp -a /tmp/pretrain-repo/pretrain-1b-on-2xT4/. ./

          python - <<'PY'
          from pathlib import Path
          import hashlib
          import json
          import shutil

          root = Path(".")

          cff = root / "CITATION.cff"
          if cff.exists():
              s = cff.read_text()
              s = s.replace(
                  "https://github.com/OWNER/pretrain-1b-on-2xT4",
                  "https://github.com/VijayendraDwari/pretrain-1b-on-2xT4",
              )
              cff.write_text(s)

          # The bootstrap transport is temporary; remove it from the public tree.
          if (root / "bootstrap").exists():
              shutil.rmtree(root / "bootstrap")
          workflow = root / ".github/workflows/bootstrap.yml"
          if workflow.exists():
              workflow.unlink()

          checks = {}
          for p in sorted(root.rglob("*")):
              if not p.is_file():
                  continue
              if ".git" in p.parts or p.name == "CHECKSUMS.json":
                  continue
              b = p.read_bytes()
              checks[str(p)] = {
                  "bytes": len(b),
                  "sha256": hashlib.sha256(b).hexdigest(),
              }

          (root / "CHECKSUMS.json").write_text(
              json.dumps(checks, indent=2) + "\n"
          )
          PY

      - name: Commit expanded repository
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Populate training, data, evaluation, docs, and results"
          git push
